<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星枢 · 玄学排盘系统</title>
<style>
:root {
  --bg: #f5efe4;
  --ink: #2c2a26;
  --gold: #8b6f3e;
  --red: #9e3b33;
  --panel: #fffcf5;
  --border: #d8c9a8;
  --muted: #8a7f6a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Kaiti SC","STKaiti","KaiTi",serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
}
header {
  text-align:center; padding: 26px 20px 10px;
  border-bottom: 1px solid var(--border);
}
header h1 { font-size: 2.2em; color: var(--gold); letter-spacing: 0.2em; }
header p { color: var(--muted); margin-top: 6px; font-size: 0.95em; }
.container { max-width: 1100px; margin: 0 auto; padding: 20px; }
.form-panel {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 22px; margin: 18px 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.form-row { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; }
.field { display:flex; flex-direction:column; gap:4px; }
.field label { font-size:0.85em; color:#6b6150; }
.field input, .field select {
  padding: 8px 12px; border:1px solid var(--border); border-radius:4px;
  font-family: inherit; font-size:1em; background:#fff; width: 92px;
}
.btn {
  background: var(--red); color:#fff; border:none; padding: 10px 28px;
  border-radius:4px; font-family:inherit; font-size:1.05em; cursor:pointer;
  letter-spacing:0.1em;
}
.btn:hover { opacity:0.9; }
.btn:disabled { opacity:0.5; cursor:default; }

/* 体系选择：按类分组的宫格 */
.cat-title {
  font-size: 0.9em; color: var(--red); margin: 14px 0 6px;
  padding-bottom: 3px; border-bottom: 1px dashed var(--border);
  letter-spacing: 0.1em;
}
.systems { display:flex; flex-wrap:wrap; gap:8px; }
.sys-tag {
  padding: 7px 14px; border:1px solid var(--border); border-radius:18px;
  cursor:pointer; background:#fff; font-family:inherit; font-size:0.9em;
  transition: all 0.15s; position: relative;
}
.sys-tag:hover { border-color: var(--gold); }
.sys-tag.active { background: var(--gold); color:#fff; border-color: var(--gold); }
.sys-tag .badge {
  font-size:0.7em; color:var(--muted); margin-left:5px;
}
.sys-tag.active .badge { color:#f0e6d2; }

#result {
  background: var(--panel); border:1px solid var(--border); border-radius:8px;
  padding: 22px; margin-top: 18px; min-height: 160px;
  font-size: 0.95em; line-height: 1.7;
}
#result.loading { color:var(--muted); font-style:italic; }
table { border-collapse: collapse; width:100%; margin: 10px 0; }
th, td { border:1px solid var(--border); padding: 8px 12px; text-align:left; vertical-align: top; }
th { background:#f7f0e2; }
.section-title {
  color: var(--red); font-weight:bold; font-size:1.12em;
  margin: 18px 0 8px; padding-bottom:4px; border-bottom: 1px dashed var(--border);
}
.muted { color: var(--muted); font-size:0.9em; }
pre.json {
  background:#2d2a26; color:#e8e0d0; padding:16px; border-radius:6px;
  overflow-x:auto; font-size:0.85em; font-family:"JetBrains Mono",monospace;
  white-space: pre-wrap; word-break: break-all;
}
.warn {
  background:#fdf6e3; border-left:3px solid var(--gold);
  padding:10px 14px; margin:10px 0; font-size:0.9em;
}

/* 九宫格（洛书排布） */
.grid9 {
  display:grid; grid-template-columns: repeat(3, 1fr); gap:4px;
  max-width: 560px; margin: 12px auto; background: var(--border); padding:4px;
}
.grid9 .cell {
  background: var(--panel); padding:10px 8px; min-height:104px;
  font-size:0.82em; line-height:1.5;
}
.grid9 .cell .gname { font-size:1.25em; color:var(--red); display:block; margin-bottom:4px; }
.grid9 .cell .row { color:#5c5344; }
.grid9 .cell.center { background:#f7f0e2; }

/* 爻象 */
.hexagram { display:flex; gap:22px; flex-wrap:wrap; margin:10px 0; }
.hex-one { text-align:center; }
.hex-one .hname { font-size:0.9em; color:var(--red); margin-bottom:6px; }
.yao { height:9px; margin:3px 0; width:78px; position:relative; }
.yao.yang { background: var(--ink); }
.yao.yin { display:flex; gap:10px; }
.yao.yin i { flex:1; background: var(--ink); display:block; }
</style>
</head>
<body>
<header>
  <h1>星枢</h1>
  <p>古今中外 · 玄学排盘系统 · <span id="sysCount">载入中…</span></p>
</header>
<div class="container">
  <div class="form-panel">
    <div class="form-row">
      <div class="field"><label>公历年</label><input type="number" id="year" value="1990" min="1900" max="2100"></div>
      <div class="field"><label>月</label><input type="number" id="month" value="6" min="1" max="12"></div>
      <div class="field"><label>日</label><input type="number" id="day" value="15" min="1" max="31"></div>
      <div class="field"><label>时</label><input type="number" id="hour" value="14" min="0" max="23"></div>
      <div class="field"><label>分</label><input type="number" id="minute" value="30" min="0" max="59"></div>
      <div class="field"><label>性别</label>
        <select id="gender"><option value="M">男</option><option value="F">女</option></select>
      </div>
      <button class="btn" id="runBtn" onclick="runChart()">排盘</button>
    </div>
    <div id="systemBox"></div>
  </div>
  <div id="result">输入出生信息，选择排盘体系，点击「排盘」。</div>
</div>

<script type="module">
// ═══════════════════════════════════════════════════════════
// 体系来源有两条路：
//   A. 后端 Python（/systems 返回）—— 重体系（星象/天文计算），
//      POST /api/<id>（本机直算）或 /api/astro/<id>（星命网关代算）
//   B. 前端 JS 内核（./kernel/）—— 轻体系（排盘/查表），
//      浏览器里直接算，不走网络。这套内核与长命阁小程序同源。
// 目标是让这里的可选项与小程序一屏对齐（52 个）。
// ═══════════════════════════════════════════════════════════

let apiSystems = [];        // 来自后端
let localModules = [];      // 来自前端 JS 内核
let current = null;
const localMap = {};        // id -> module（前端能算的）

const GUA64_CACHE = {};

async function boot() {
  // ① 后端体系
  try {
    const r = await fetch('/systems');
    const d = await r.json();
    apiSystems = (d.systems || []).map(s => ({
      id: s.id, name: s.name, cat: s.cat || '其它', origin: s.origin || 'api',
    }));
  } catch (e) {
    apiSystems = [];
    console.warn('后端 /systems 读取失败：', e);
  }

  // ② 前端 JS 内核（失败不影响后端体系）
  try {
    const K = await import('./kernel/ui/modules.js');   // 相对路径：仓库自包含，任何静态服务器/子路径都能跑
    localModules = (K.MODULES || []).map(m => ({
      id: m.id, name: m.name, cat: m.cat || '其它', origin: 'local', mod: m,
    }));
    localModules.forEach(m => { localMap[m.id] = m.mod; });
  } catch (e) {
    localModules = [];
    console.warn('前端内核载入失败：', e);
  }

  // ③ 由长命阁新增的「五行体质」（源项目没有，单独文件）
  try {
    const T = await import('./kernel/engines/tizhi.js');
    if (T.tizhi) {
      const mod = {
        id: 'tizhi', name: '五行体质', cat: '中医', glyph: '医',
        desc: '四柱五行偏性 → 体质倾向 → 调养取向（框架级，非诊断）',
        run: (v) => T.tizhi(v),
      };
      localModules.push({ id: 'tizhi', name: '五行体质', cat: '中医', origin: 'local', mod });
      localMap['tizhi'] = mod;
    }
  } catch (e) { /* 没有就算了 */ }

  renderSystemPicker();
  const total = new Set([...apiSystems.map(s => s.id), ...localModules.map(m => m.id)]).size;
  document.getElementById('sysCount').textContent = total + ' 个体系统';
}

// 分类排序：中国传统在前，西方在后
const CAT_ORDER = ['命理', '卜筮', '上古三式', '风水', '相术', '中医', '其它'];

function renderSystemPicker() {
  // 合并去重：同 id 优先用前端 JS（本地算更快、不占后端）
  const merged = new Map();
  apiSystems.forEach(s => merged.set(s.id, { ...s, impl: 'api' }));
  localModules.forEach(m => {
    const exist = merged.get(m.id);
    merged.set(m.id, { id: m.id, name: m.name, cat: m.cat || (exist ? exist.cat : '其它'),
                       origin: 'local', impl: 'local' });
  });

  const byCat = {};
  for (const s of merged.values()) {
    const c = s.cat || '其它';
    (byCat[c] = byCat[c] || []).push(s);
  }
  const cats = Object.keys(byCat).sort((a, b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });

  const box = document.getElementById('systemBox');
  box.innerHTML = '';
  cats.forEach(cat => {
    const t = document.createElement('div');
    t.className = 'cat-title';
    t.textContent = cat;
    box.appendChild(t);

    const row = document.createElement('div');
    row.className = 'systems';
    byCat[cat].forEach(s => {
      const tag = document.createElement('span');
      tag.className = 'sys-tag';
      tag.dataset.id = s.id;
      // 本地能算的标个「本」字，便于知道不依赖后端
      tag.innerHTML = escapeHtml(s.name) +
        '<span class="badge">' + (s.impl === 'local' ? '本' : '网') + '</span>';
      tag.onclick = () => selectSystem(s.id);
      row.appendChild(tag);
    });
    box.appendChild(row);
  });

  const first = cats.length ? byCat[cats[0]][0] : null;
  if (first) selectSystem(first.id);
}

function selectSystem(id) {
  current = id;
  document.querySelectorAll('.sys-tag').forEach(t => {
    t.classList.toggle('active', t.dataset.id === id);
  });
}

function payload() {
  return {
    year: +document.getElementById('year').value,
    month: +document.getElementById('month').value,
    day: +document.getElementById('day').value,
    hour: +document.getElementById('hour').value,
    minute: +document.getElementById('minute').value,
    gender: document.getElementById('gender').value,
  };
}

async function runChart() {
  if (!current) { alert('请先选一个体系'); return; }
  const res = document.getElementById('result');
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  res.className = 'loading';
  res.textContent = '推演中…';

  try {
    // 前端 JS 能算的，就在浏览器里算
    if (localMap[current]) {
      const v = {
        y: payload().year, mo: payload().month, d: payload().day,
        h: payload().hour, mi: payload().minute, gender: payload().gender,
      };
      const out = localMap[current].run(v);
      res.className = '';
      res.innerHTML = renderLocal(current, out);
      return;
    }

    // 后端体系：本地直算的走 /api/<id>，网关的走 /api/astro/<id>
    const isLocalApi = ['bazi', 'ziwei', 'cetian', 'liuren', 'qimen',
                        'huangji', 'qizheng', 'liuyao', 'beiji'].includes(current);
    const url = isLocalApi ? '/api/' + current : '/api/astro/' + encodeURIComponent(current);
    const r = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload()),
    });
    const data = await r.json();
    if (!r.ok) {
      res.className = '';
      res.innerHTML = '<div class="warn">排盘失败：' +
        escapeHtml(JSON.stringify(data).slice(0, 400)) + '</div>';
      return;
    }
    res.className = '';
    res.innerHTML = renderApi(current, data);
  } catch (e) {
    res.className = '';
    res.innerHTML = '<div class="warn">请求失败：' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
  }
}

// ── 渲染 ────────────────────────────────────────────────
function renderApi(sys, d) {
  if (sys === 'bazi') return renderBazi(d);
  if (sys === 'ziwei') return renderZiwei(d);
  if (sys === 'qimen') return renderGrid9('奇门遁甲 · 九宫', d, qimenCell);
  if (sys === 'liuyao') return renderLiuyao(d);

  // 网关体系：优先用引擎给的格式化文本，其次结构化表格，最后兜底 JSON
  let html = '';
  const name = d.name || sys;
  html += '<div class="section-title">' + escapeHtml(name) + (d.cat ? ' · ' + escapeHtml(d.cat) : '') + '</div>';
  if (d.text) html += '<div style="white-space:pre-wrap">' + escapeHtml(d.text) + '</div>';
  else if (d.data) html += kvTable(d.data, 0);
  else html += kvTable(d, 0);
  return html;
}

function renderLocal(sys, out) {
  let html = '<div class="section-title">' + escapeHtml(sys) + '</div>';
  if (out && out.text) {
    html += (out.chart ? '<div style="white-space:pre-wrap">' + escapeHtml(out.chart) + '</div>' : '');
    html += '<div style="white-space:pre-wrap">' + escapeHtml(out.text) + '</div>';
  } else {
    html += kvTable(out, 0);
  }
  return html;
}

/** 把任意嵌套对象渲染成可读表格 */
function kvTable(o, depth) {
  if (o === null || o === undefined) return '<span class="muted">-</span>';
  if (typeof o !== 'object') return escapeHtml(String(o));
  if (Array.isArray(o)) {
    if (!o.length) return '<span class="muted">空</span>';
    if (typeof o[0] !== 'object') return escapeHtml(o.join('、'));
    return o.map((x, i) => '<div style="margin:6px 0"><b>#' + (i + 1) + '</b>' + kvTable(x, depth + 1) + '</div>').join('');
  }
  let h = '<table>';
  for (const [k, v] of Object.entries(o)) {
    h += '<tr><th style="width:24%">' + escapeHtml(k) + '</th><td>' + kvTable(v, depth + 1) + '</td></tr>';
  }
  return h + '</table>';
}

function renderBazi(d) {
  const keys = [['year_pillar', '年柱'], ['month_pillar', '月柱'],
                ['day_pillar', '日柱'], ['hour_pillar', '时柱']];
  let html = '<div class="section-title">四柱八字</div><table><tr>';
  keys.forEach(([, label]) => html += '<th>' + label + '</th>');
  html += '</tr><tr>';
  keys.forEach(([k]) => {
    const p = d[k];
    html += '<td>' + (p ? escapeHtml((p.stem || '') + (p.branch || '')) : '-') + '</td>';
  });
  html += '</tr><tr>';
  keys.forEach(([k]) => {
    const p = d[k];
    html += '<td class="muted">' + (p ? escapeHtml((p.wuxing_stem || '') + (p.wuxing_branch || '')) : '') + '</td>';
  });
  html += '</tr></table>';

  html += '<div class="section-title">日主分析</div><table>';
  html += '<tr><td>日主</td><td>' + escapeHtml(d.day_master || '-') + '（' + escapeHtml(d.day_master_wuxing || '') + '）</td>';
  html += '<td>强弱</td><td>' + escapeHtml(d.day_master_strength || '-') +
          '（' + escapeHtml(String(d.day_master_strength_score || '')) + '分，' + escapeHtml(d.day_master_vitality || '') + '）</td></tr>';
  html += '<tr><td>格局</td><td>' + escapeHtml(d.pattern || '-') + '</td>';
  html += '<td>用神</td><td>' + escapeHtml(d.yongshen || '-') + '（喜' + escapeHtml(d.xishen || '') + ' 忌' + escapeHtml(d.jishen || '') + '）</td></tr>';
  html += '<tr><td>调候</td><td>' + escapeHtml(d.tiaohoushen || '-') + '</td>';
  html += '<td>大运</td><td>' + escapeHtml(d.dayun_direction || '') + '，' + escapeHtml(String(d.dayun_start_age || '')) + '岁起运</td></tr>';
  html += '</table>';
  if (d.pattern_description_zh) html += '<p>' + escapeHtml(d.pattern_description_zh) + '</p>';
  if (d.yongshen_description_zh) html += '<p>' + escapeHtml(d.yongshen_description_zh) + '</p>';
  return html;
}

function renderZiwei(d) {
  let html = '<div class="section-title">紫微斗数</div><table>';
  html += '<tr><td>农历</td><td>' + escapeHtml(String(d.lunar_year || '')) + '年' +
          escapeHtml(String(d.lunar_month || '')) + '月' + escapeHtml(String(d.lunar_day || '')) + '日</td>';
  html += '<td>阴阳</td><td>' + escapeHtml(d.yin_yang || '-') + '</td></tr>';
  html += '<tr><td>五行局</td><td>' + escapeHtml(d.wu_xing_ju || '-') + '</td>';
  html += '<td>紫微星</td><td>在' + escapeHtml(d.ziwei_branch || '-') + '</td></tr>';
  html += '<tr><td>命主</td><td>' + escapeHtml(d.ming_zhu || '-') + '</td>';
  html += '<td>身主</td><td>' + escapeHtml(d.shen_zhu || '-') + '</td></tr>';
  html += '</table>';
  return html;
}

/** 洛书九宫：4 9 2 / 3 5 7 / 8 1 6 —— 奇门、玄空这类盘式都用这个排法 */
const LUOSHU = [
  [4, 9, 2],
  [3, 5, 7],
  [8, 1, 6],
];

function renderGrid9(title, d, cellFn) {
  // 从返回体里找出「宫」数组（字段名各体系不一，逐个试）
  const palaces = d.palaces || d.gong || (d.data && (d.data.palaces || d.data.gong)) || null;
  let html = '<div class="section-title">' + escapeHtml(title) + '</div>';
  const byNum = {};
  if (Array.isArray(palaces)) {
    palaces.forEach((p, i) => {
      const n = p && (p.num || p.gong || p.index || (i + 1));
      byNum[Number(n)] = p;
    });
  }
  html += '<div class="grid9">';
  LUOSHU.forEach(row => row.forEach(n => {
    const p = byNum[n];
    html += '<div class="cell' + (n === 5 ? ' center' : '') + '">' +
            '<span class="gname">' + n + '宫</span>' +
            (p ? cellFn(p) : '<span class="muted">—</span>') + '</div>';
  }));
  html += '</div>';
  if (!palaces) {
    html += '<div class="warn">该体系未返回九宫结构，下面给出原始数据。</div>';
    html += kvTable(d, 0);
  }
  return html;
}

function qimenCell(p) {
  const rows = [];
  if (p.god) rows.push('八神 ' + p.god);
  if (p.star) rows.push('九星 ' + p.star);
  if (p.door || p.men) rows.push('八门 ' + (p.door || p.men));
  if (p.tianPan || p.tianpan) rows.push('天盘 ' + (p.tianPan || p.tianpan));
  if (p.diPan || p.dipan) rows.push('地盘 ' + (p.diPan || p.dipan));
  if (!rows.length) {
    return Object.entries(p).filter(([k, v]) => typeof v !== 'object')
      .slice(0, 5).map(([k, v]) => '<div class="row">' + escapeHtml(k) + ' ' + escapeHtml(String(v)) + '</div>').join('');
  }
  return rows.map(r => '<div class="row">' + escapeHtml(r) + '</div>').join('');
}

function renderLiuyao(d) {
  const yao = d.yao || d.lines || d.hexagram || null;
  let html = '<div class="section-title">六爻</div>';
  if (Array.isArray(yao) && yao.length >= 6) {
    html += '<div class="hexagram">';
    html += '<div class="hex-one"><div class="hname">本卦</div>';
    // 爻自下而上，显示时上爻在上
    [...yao].slice(0, 6).reverse().forEach(y => {
      const yang = (typeof y === 'number') ? (y === 1) : !!(y.yang || y.type === 'yang');
      html += yang ? '<div class="yao yang"></div>' : '<div class="yao yin"><i></i><i></i></div>';
    });
    html += '</div></div>';
  }
  html += kvTable(d, 0);
  return html;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

window.runChart = runChart;
boot();
</script>
</body>
</html>
